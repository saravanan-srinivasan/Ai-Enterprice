services:
  - type: web
    name: enterprise-ai-backend
    env: python
    plan: free

    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn api_gateway.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    envVars:
      - key: APP_ENV
        value: production

      - key: DEBUG
        value: "false"

      - key: DATA_DIR
        value: /opt/render/project/data

      - key: LOG_LEVEL
        value: INFO

      - key: VECTOR_STORE_TYPE
        value: chroma

      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2

      - key: LLM_MODEL
        value: llama-3.3-70b-versatile

      - key: WORKERS
        value: "1"

      - key: CORS_ORIGINS
        value: https://example.com

      - key: GROQ_API_KEY
        sync: false